<!doctype html>
<html><head><title>Zoom</title></head><body>
  <div id="stage" style="width:700px;height:400px;background:#222"></div>
  <div id="modal" style="position:fixed;top:20%;left:25%;width:50%;height:44%;background:#fff;border:1px solid #ccc;z-index:9">
    <h2>Do you want people to see you in the meeting?</h2>
    <p>You can still turn off your microphone and camera anytime in the meeting</p>
    <button id="usemic" onclick="window.__usedMic=true">Use microphone and camera</button>
    <a href="/zoom-enter-name">Continue without microphone and camera</a>
  </div>
</body></html>
