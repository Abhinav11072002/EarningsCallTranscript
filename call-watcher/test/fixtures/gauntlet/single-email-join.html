<!doctype html>
<html><head><title>Join the call</title>
<meta name="expect-joined" content="true"><meta name="expect-refused" content="false"></head>
<body>
  <h1>Join the Q2 2026 earnings call</h1>
  <form id="f">
    <input id="em" type="email" placeholder="Your email address" data-expect="email">
    <button type="submit">Join now</button>
  </form>
  <div id="ok" hidden data-incall="true"><h2>Live</h2><audio controls></audio></div>
  <script>
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!document.getElementById('em').value.trim()) return;
      document.getElementById('f').hidden = true;
      document.getElementById('ok').hidden = false;
    });
  </script>
</body></html>
