<!doctype html>
<html><head><title>Register</title>
<meta name="expect-joined" content="true"><meta name="expect-refused" content="false"></head>
<body>
  <div id="host"></div>
  <div id="ok" hidden data-incall="true">Registration complete</div>
  <script>
    var root = document.getElementById('host').attachShadow({ mode: 'open' });
    root.innerHTML =
      '<form id="f">' +
      '<input id="fn" placeholder="First name" data-expect="firstName">' +
      '<input id="ln" placeholder="Last name" data-expect="lastName">' +
      '<input id="em" type="email" placeholder="Email address" data-expect="email">' +
      '<button type="submit">Register</button></form>';
    root.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      root.getElementById('f').hidden = true;
      document.getElementById('ok').hidden = false;
    });
  </script>
</body></html>
